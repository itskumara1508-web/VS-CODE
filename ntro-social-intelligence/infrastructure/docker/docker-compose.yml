version: '3.8'

services:
  # 1. PostgreSQL & TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ntro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-ntro}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ntro}
      POSTGRES_DB: ${DATABASE_NAME:-ntro_social_intelligence}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ntro -d ntro_social_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: ntro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Neo4j Graph Database
  neo4j:
    image: neo4j:5-community
    container_name: ntro-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-ntro-social-intelligence}
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4jdata:/data

  # 4. Node.js REST & Real-Time API
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: ntro-api
    restart: unless-stopped
    environment:
      PORT: 4000
      MOCK_DATA_MODE: "true"
      DATABASE_URL: "postgres://ntro:ntro@postgres:5432/ntro_social_intelligence"
      REDIS_URL: "redis://redis:6379"
      AI_SERVICE_URL: "http://ai-service:5001"
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

  # 5. Python FastAPI AI Service
  ai-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.ai
    container_name: ntro-ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_PORT: 5001
      AI_SERVICE_HOST: "0.0.0.0"
    ports:
      - "5001:5001"

volumes:
  pgdata:
  redisdata:
  neo4jdata:

